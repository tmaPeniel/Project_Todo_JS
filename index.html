<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Todo APP JS</title>
</head>
<body>
    <div class="background">
        <div class="main">
            <h1>JS To-Do List</h1>
            <div class="nav">
                <div class="add">
                    <button id="add-task" class="add-task">Add a new to-do</button>
                </div>
                <div class="filter">
                    <button class="active">All</button>
                    <button >To-Do</button>
                    <button class="completed">Completed</button>
                </div>
            </div>
            <div class="task-list">
                <table>
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>When</th>
                            <th>Priority</th>
                            <th>Fullfillment</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
