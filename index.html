<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Todo APP JS</title>
</head>
<body>
    <div class="background">
        <div class="main">
            <h1>JS To-Do List</h1>
            <div class="nav">
                <div class="add">
                    <button class="add-task">Add</button>
                </div>
                <div class="filter">
                    <button class="active">All</button>
                    <button >To-Do</button>
                    <button>Completed</button>
                </div>
            </div>
            <div class="task-list">
                <table>
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>When</th>
                            <th>Priority</th>
                            <th>Fullfillment</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Task 1</td>
                            <td>Description 1</td>
                            <td>Category 1</td>
                            <td>When 1</td>
                            <td>Priority 1</td>
                            <td>Fullfillment 1</td>
                            <td>
                                <button class="edit"><i class='bx bxs-edit'></i></button>
                                <button class="delete"><i class='bx bxs-trash'></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>Task 2</td>
                            <td>Description 2</td>
                            <td>Category 2</td>
                            <td>When 2</td>
                            <td>Priority 2</td>
                            <td>Fullfillment 2</td>
                            <td>
                                <button class="edit"><i class='bx bxs-edit'></i></button>
                                <button class="delete"><i class='bx bxs-trash'></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
