<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="formStyle.css">
    <title>Todo App Form</title>
</head>
<body>
    <div class="background">
        <div class="main">
            <h1>JS To-Do List</h1>
            
            <div class="form">
                <h4>Add a new to-do</h4>
                <form id="task-form">
                    <div class="col1">
                        <div class="name">
                            <label for="nameName">Name: </label>
                            <input type="text" id="nameName" placeholder="Task name">
                        </div>
                        <div class="description">
                            <label for="descriptionName">Description: </label>
                            <textarea id="descriptionName" placeholder="Task description"></textarea>
                        </div>
                        <div class="category">
                            <label for="categoryName">Category: </label>
                            <input type="text" id="categoryName" placeholder="Task category">
                        </div>
                        <div class="date">
                            <label for="dateName">Date: </label>
                            <input type="date" id="dateName" placeholder="dd/mm/yyyy">
                        </div>
                        <div class="time">
                            <label for="timeName">Time: </label>
                            <input type="time" id="timeName" placeholder="Task name">
                        </div>
                    </div>
                    <div class="col2">
                        <div class="priority">
                            <label for="priorityName">Priority: </label>
                            <select id="priorityName">
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="fullfillment">
                            <label for="fullfillmentName">Fullfillment: </label>
                            <input type="range" id="fullfillmentName" min="0" max="100" step="5" value="0" />
                        </div>
                        <div class="button"> 
                            <button type="submit">Save</button>
                            <div class="button-cancel"><a href="index.html">Cancel</a></div>
                        </div>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
    <script src="form.js"></script>
    
</body>
</html>
