<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="formStyle.css">
    <title>Todo App Form</title>
</head>
<body>
    <div class="background">
        <div class="main">
            <h1>JS To-Do List</h1>
            
            <div class="form">
                <h4>Add a new to-do</h4>
                <form id="">
                    <div class="col1">
                        <div class="name">
                            <label for="nameName">Name: </label>
                            <input type="text" name="nameName" id="" placeholder="Task name">
                        </div>
                        <div class="description">
                            <label for="descriptionName">Description: </label>
                            <textarea name="descriptionName" id="" placeholder="Task description"></textarea>
                        </div>
                        <div class="category">
                            <label for="categoryName">Category: </label>
                            <input type="text" name="categoryName" id="" placeholder="Task category">
                        </div>
                        <div class="date">
                            <label for="dateName">Date: </label>
                            <input type="date" name="dateName" id="" placeholder="dd/mm/yyyy">
                        </div>
                        <div class="time">
                            <label for="timeName">Time: </label>
                            <input type="time" name="timeName" id="" placeholder="Task name">
                        </div>
                    </div>
                    <div class="col2">
                        <div class="priority">

                        </div>
                        <div class="fufillement">

                        </div>
                        <div class="button">
                            <button type="submit">Save</button>
                            <div class="button-cancel"><a href="">Cancel</a></div>
                        </div>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
    <script src="app.js"></script>
    
</body>
</html>
